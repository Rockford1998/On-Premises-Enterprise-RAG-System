name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server (typecheck, lint, test)
    runs-on: ubuntu-latest
    # Real Postgres for the DB integration tests (skipped when
    # TEST_DATABASE_URL is unset). Same image as server/docker.
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: poc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://root:root@localhost:5432/poc_test
